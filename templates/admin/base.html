{% extends "base.html" %}

{% block content %}

        <div class="flex items-center justify-between mb-6">
            <div>
                <h1 class="text-4xl font-bold bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent">
                    Admin Panel ✨
                </h1>
                <p class="text-gray-600 mt-2">Manage your application</p>
            </div>
            <div class="text-6xl">👑</div>
        </div>

        <div class="flex space-x-4">
            <a href="/admin/users" class="bg-gradient-to-r from-blue-500 to-purple-500 text-white px-6 py-3 rounded-lg font-semibold hover:shadow-xl transition">
                Users
            </a>
        </div>
    </div>

    {% block admin_content %}{% endblock %}
</div>
{% endblock %}
