{% extends "base.html" %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="glass p-8 rounded-3xl shadow-2xl">
        <h1 class="text-4xl font-bold mb-6 bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent">
            My Profile ✨
        </h1>

        <form method="POST" class="space-y-6">
            <div>
                <label for="full_name" class="block text-sm font-medium text-gray-700 mb-2">Full Name</label>
                <input type="text" id="full_name" name="full_name" value="{{ user.full_name }}"
                       class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Username</label>
                <input type="text" value="{{ user.username }}" disabled
                       class="w-full px-4 py-3 rounded-lg bg-gray-100 border border-gray-300">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Role</label>
                <input type="text" value="{{ user.role }}" disabled
                       class="w-full px-4 py-3 rounded-lg bg-gray-100 border border-gray-300 capitalize">
            </div>

            <button type="submit"
                    class="w-full bg-gradient-to-r from-blue-500 to-purple-500 text-white py-3 rounded-lg font-semibold hover:shadow-xl transform hover:scale-105 transition">
                Update Profile ✨
            </button>
        </form>
    </div>
</div>
{% endblock %}
