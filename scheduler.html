<!DOCTYPE html>
<html>
<head>
    <title>CleanStream - Visual Schedule</title>
    <link href='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css' rel='stylesheet' />
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js'></script>
    <style>
        body { font-family: sans-serif; display: flex; margin: 0; background-color: #f8f9fa; }
        .sidebar { width: 250px; background: #1e293b; color: white; min-height: 100vh; padding: 20px; }
        .content { flex: 1; padding: 40px; }
        #calendar { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .fc-event { background-color: #2563eb; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>CleanStream</h2>
        <a href="dashboard.html" style="color: white; text-decoration: none;">← Dashboard</a>
    </div>
    <div class="content">
        <h1>Upcoming Appointments</h1>
        <div id="calendar"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var calendarEl = document.getElementById('calendar');
            var calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                events: '/cgi-bin/get_calendar_data.py',
                dateClick: function(info) {
                    let uId = prompt("Enter Customer ID:");
                    let cId = prompt("Enter Cleaner ID:");
                    if (uId && cId) {
                        let start = info.dateStr + " 09:00:00";
                        let end = info.dateStr + " 10:00:00";
                        saveAppointment(uId, cId, start, end);
                    }
                }
            });
            calendar.render();
        });

        function saveAppointment(userId, cleanerId, startTime, endTime) {
            const params = `user_id=${userId}&cleaner_id=${cleanerId}&start_time=${startTime}&end_time=${endTime}`;
            fetch(`/cgi-bin/make_appointment.py?${params}`)
                .then(res => res.json())
                .then(data => {
                    if(data.status === "success") {
                        alert(data.message);
                        location.reload(); 
                    } else {
                        alert("Error: " + data.message);
                    }
                })
                .catch(err => alert("Failed to connect to backend."));
        }
    </script>
</body>
</html>
